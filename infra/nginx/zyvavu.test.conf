# Port must match config/dev-server.json. HTTP only, port 80.
server {
    listen 80;
    server_name zyvavu.test;

    allow 127.0.0.1;
    allow ::1;
    deny all;

    client_max_body_size 100m;

    location /_next/hmr {
        proxy_pass http://127.0.0.1:3107/_next/hmr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    location / {
        proxy_pass http://127.0.0.1:3107;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    server_name zyvavu.test;

    ssl_certificate      "C:/laragon/etc/ssl/laragon.crt";
    ssl_certificate_key  "C:/laragon/etc/ssl/laragon.key";

    allow 127.0.0.1;
    allow ::1;
    deny all;

    client_max_body_size 100m;

    location /_next/hmr {
        proxy_pass http://127.0.0.1:3107/_next/hmr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    location / {
        proxy_pass http://127.0.0.1:3107;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_buffering off;
    }
}
